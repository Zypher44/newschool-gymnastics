{% extends 'public_base.html' %}
{% block title %}Choose a new password{% endblock %}
{% block content %}<section class="container py-5" style="max-width:600px"><h1 class="h3">Choose a new password</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Save password</button></form>{% else %}<p>This reset link is invalid, expired, or already used.</p><a href="{% url 'password_reset' %}">Request another link</a>{% endif %}</section>{% endblock %}
