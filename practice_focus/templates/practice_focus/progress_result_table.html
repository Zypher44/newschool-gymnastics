<section class="progress-card"><h2 class="h5">{{ heading }}</h2>{% if rows %}<div class="progress-table-wrap"><table><thead><tr><th>Event / skill</th><th>Wow</th><th>Hit</th><th>Attempt</th><th>Success</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.label }}</td><td>{{ row.wow }}</td><td>{{ row.hit }}</td><td>{{ row.attempt }}</td><td>{{ row.success }}%</td></tr>{% endfor %}</tbody></table></div>{% else %}<p>No approved results this week.</p>{% endif %}</section>
